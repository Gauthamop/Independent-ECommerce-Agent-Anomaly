# Everything e-commerce-specific lives HERE (and in the generator).
# The adapter, detectors, tools and agent only read this file; they never hard-code these names.

timezone: Asia/Kolkata        # raw files are in local time; the clean tables are UTC

# metric type decides which detector the registry will pick later
metrics:
  orders:       {type: count, description: "number of customer orders placed per minute across the whole shop"}
  decline_rate: {type: rate,  description: "share of card payment attempts that the customer's bank declines (per bank and region)"}
  latency_ms:   {type: gauge, description: "how long the website takes to answer a request, in milliseconds (per region)"}
  memory_pct:   {type: gauge, description: "percent of a server's memory that is in use (per server)"}

# fixed alert limits, like an ops team would set by hand (the baseline to beat)
thresholds:
  orders:       {upper: 200}
  decline_rate: {upper: 0.10}
  latency_ms:   {upper: 300}
  memory_pct:   {upper: 85}

# what each service does: a short, neutral service catalog. The LLM judge reads it to reason about
# whether a change to a service could plausibly affect a metric.
services:
  payment-gateway:  "sends card payments to the customers' banks and handles the banks' responses"
  checkout-service: "runs the checkout flow and places orders"
  search-service:   "serves the website's search results"
  cart-service:     "stores the shopping cart and shows the cart page"
  email-service:    "sends marketing and order emails to customers"

# which detectors run for each metric TYPE (the registry reads this)
detectors:
  count: [seasonal]
  rate:  [seasonal]
  gauge: [seasonal, drift]

detector_params:
  seasonal:
    train_days: 8        # clean learning period at the start (no known problems in it)
    z_threshold: 4.0
    min_points: 3
  drift:
    window: 288          # 1 day of 5-minute points
    lookback: 288
    z_threshold: 6.0
    min_rel_change: 0.01 # at least 1% of the normal level per day
    train_days: 8
    min_points: 3

# planned events from the company calendar (dates are UTC days). Counts may surge on these days.
events:
  - {date: "2025-01-15", name: sale}

# how to read each messy raw file.
# 'pattern' is a regex on the column name. Named groups become the entity and tags,
# so a 7th bank would be picked up with no code change.
sources:
  - file: orders_export.csv
    time_col: ts_local
    time_format: "%d/%m/%Y %H:%M"
    columns:
      - {pattern: '^ord_cnt$', metric: orders, entity: "all"}

  - file: payments_wide.csv
    time_col: "Time (IST)"
    time_format: "%Y-%m-%d %H:%M:%S"
    columns:
      - pattern: '^dclnrt_(?P<bank>bank_[a-z])_(?P<region>north|south)$'
        metric: decline_rate
        entity: "{bank}/{region}"
        tags: [bank, region]

  - file: infra_wide.csv
    time_col: time_ist
    time_format: "%d-%b-%Y %H:%M"
    columns:
      - pattern: '^lat_ms_(?P<region>north|south)$'
        metric: latency_ms
        entity: "{region}"
        tags: [region]
      - pattern: '^mem_pct_(?P<server>server_\d+)$'
        metric: memory_pct
        entity: "{server}"
        tags: [server]

# the agent's "what changed?" source
changes:
  file: deploy_log.csv
  time_col: when_local
  time_format: "%Y-%m-%d %H:%M"
  columns: {service: svc, change_type: kind, description: note}
